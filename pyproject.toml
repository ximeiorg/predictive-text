[project]
name = "wubi-lianxiang"
version = "0.1.0"
description = "Lightweight Decoder-Only Transformer for input method prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "sentencepiece>=0.2.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "wikiextractor>=3.0.0",
    "opencc>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tokenizers>=0.15.0",
    "tensorboard>=2.20.0",
]

[project.scripts]
train = "src.train:main"
build-vocab = "src.build_vocab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
