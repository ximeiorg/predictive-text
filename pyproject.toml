[project]
name = "predictive-text"
version = "0.1.0"
description = "Lightweight Transformer for Chinese predictive text input"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch>=2.6.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tokenizers>=0.15.0",
    "tensorboard>=2.20.0",
    "rich",
    "lightning>=2.4.0",
    "pyyaml>=6.0.0",
    "onnxscript>=0.7.0",
    "onnxruntime>=1.25.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.optional-dependencies]
mobile = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]

[project.scripts]
train = "src.train:main"
build-vocab = "src.build_vocab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true



